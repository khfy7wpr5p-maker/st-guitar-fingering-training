name: s2a-v3-contract

on:
  pull_request:
    paths:
      - 'src/st_guitar_fingering_training/s2a_v3_consensus_tournament.py'
      - 'tests/test_s2a_v3_consensus_tournament.py'
      - 'scripts/run_s2a_v3_after_teacher_session.py'
      - 'scripts/verify_s2a_v3_contract.py'
      - 'docs/stage7g_e3_s2a_v3_*'
      - '.github/workflows/s2a_v3_contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -e .
      - name: Frozen contract
        run: python scripts/verify_s2a_v3_contract.py
      - name: Focused v3 tests
        run: python -m unittest tests.test_s2a_v3_consensus_tournament -v
      - name: Compile v3
        run: python -m py_compile src/st_guitar_fingering_training/s2a_v3_consensus_tournament.py scripts/run_s2a_v3_after_teacher_session.py
