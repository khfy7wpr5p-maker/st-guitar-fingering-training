name: guitarset-voicing-development-v2

on:
  pull_request:

permissions:
  contents: read

jobs:
  development-fit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Decide whether v2 DEVELOPMENT may run
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          request='evidence/stage7g_e4_guitarset_observed_voicing_development_request_v2.json'
          evidence='evidence/stage7g_e4_guitarset_observed_voicing_development_v2.json'
          model='evidence/stage7g_e4_guitarset_observed_voicing_development_model_v2.json'
          test -f "$request"
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('evidence/stage7g_e4_guitarset_observed_voicing_development_request_v2.json').read_text())
          assert p == {
              'feature_schema_sha256': '617981e90cce46c941596d1bd50ffffff64e6816c59d8f0dbed1acd6d8938285',
              'model_version': 'GUITARSET-OBSERVED-VOICING-MODEL.v2',
              'production_authorized': False,
              'protocol_sha256': 'db67d88c4889a2b8c63411cd1e9bbd7481248dfbdd76da67f5df60b3871b4c02',
              'runtime_connection_authorized': False,
              'schema': 'st-guitar-guitarset-observed-voicing-development-request-v2',
              'source_archive_sha256': '06dc776d1de92021632e30795f0d4f38534fe01ca5342a164e80e8cd287980fe',
              'training_authorized': True,
              'validation_access_authorized': False,
              'final_access_authorized': False,
          }
          PY
          if test -f "$evidence" || test -f "$model"; then
            test -f "$evidence" && test -f "$model"
            echo 'run_development=false' >> "$GITHUB_OUTPUT"
            echo 'GuitarSet v2 DEVELOPMENT evidence is already sealed; training will not be reopened.'
          else
            echo 'run_development=true' >> "$GITHUB_OUTPUT"
            echo 'Opening authorized GuitarSet v2 DEVELOPMENT performers only.'
          fi

      - name: Install frozen DEVELOPMENT environment
        if: steps.gate.outputs.run_development == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'scikit-learn==1.8.0'
          python -m pip install -e .

      - name: Download hash-pinned GuitarSet 1.0.1 annotations
        if: steps.gate.outputs.run_development == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            'https://zenodo.org/records/1422265/files/GuitarSet_annotation_only.zip?download=1' \
            --output /tmp/GuitarSet_annotation_only.zip
          echo '06dc776d1de92021632e30795f0d4f38534fe01ca5342a164e80e8cd287980fe  /tmp/GuitarSet_annotation_only.zip' | sha256sum -c -

      - name: Execute GuitarSet v2 DEVELOPMENT fit
        if: steps.gate.outputs.run_development == 'true'
        id: development
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/guitarset-development-v2
          set +e
          python scripts/run_guitarset_voicing_development_v2.py \
            /tmp/GuitarSet_annotation_only.zip \
            --report /tmp/guitarset-development-v2/stage7g_e4_guitarset_observed_voicing_development_v2.json \
            --model /tmp/guitarset-development-v2/stage7g_e4_guitarset_observed_voicing_development_model_v2.json
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          test -f /tmp/guitarset-development-v2/stage7g_e4_guitarset_observed_voicing_development_v2.json

      - name: Upload sealed v2 DEVELOPMENT evidence
        if: steps.gate.outputs.run_development == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guitarset-observed-voicing-development-v2
          path: /tmp/guitarset-development-v2/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce DEVELOPMENT gate result
        if: steps.gate.outputs.run_development == 'true'
        shell: bash
        run: |
          test "${{ steps.development.outputs.exit_code }}" -eq 0
