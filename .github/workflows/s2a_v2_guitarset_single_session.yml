name: s2a-v2-guitarset-single-session

on:
  pull_request:
    paths:
      - '.github/workflows/s2a_v2_guitarset_single_session.yml'
      - 'scripts/build_s2a_v2_guitarset_single_session.py'
      - 'src/st_guitar_fingering_training/finger_assignments_v2.py'
      - 'src/st_guitar_fingering_training/s2a_v2_fixed_voicing.py'
      - 'src/st_guitar_fingering_training/s2a_v2_ranker.py'
      - 'tests/test_s2a_v2_fixed_voicing.py'
      - 'docs/STAGE_7G_E3_S2A_V2_GUITARSET_FIXED_VOICING_SINGLE_SESSION.md'
      - 'evidence/stage7g_e3_s2a_v2_guitarset_fixed_voicing_protocol.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Focused S2-A v2 regression tests
        run: python -m unittest tests.test_s2a_v2_fixed_voicing -v
      - name: Download and verify sealed GuitarSet annotations
        env:
          GUITARSET_URL: https://zenodo.org/records/1422265/files/GuitarSet_annotation_only.zip?download=1
          GUITARSET_SHA256: 06dc776d1de92021632e30795f0d4f38534fe01ca5342a164e80e8cd287980fe
        run: |
          set -euo pipefail
          rm -f /tmp/GuitarSet_annotation_only.zip
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 300 \
            "$GUITARSET_URL" -o /tmp/GuitarSet_annotation_only.zip
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          path = Path('/tmp/GuitarSet_annotation_only.zip')
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = os.environ['GUITARSET_SHA256']
          if digest != expected:
              raise SystemExit(f'STOP: GuitarSet SHA mismatch: expected {expected}, got {digest}')
          print(f'GuitarSet SHA verified: {digest}')
          PY
      - name: Build one-session Teacher package
        run: |
          set -euo pipefail
          rm -rf /tmp/st-guitar-s2a-v2
          python scripts/build_s2a_v2_guitarset_single_session.py \
            /tmp/GuitarSet_annotation_only.zip \
            --output-dir /tmp/st-guitar-s2a-v2 \
            --development-count 200 \
            --repeat-count 30 \
            --final-count 60 \
            --max-assignments 8
      - name: Validate package, isolation and fail-closed boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/st-guitar-s2a-v2')
          manifest = json.loads((root/'teacher'/'ST_Guitar_S2A_V2_Tek_Oturum_manifest.json').read_text(encoding='utf-8'))
          audit = json.loads((root/'internal'/'ST_Guitar_S2A_V2_Tek_Oturum_audit.json').read_text(encoding='utf-8'))
          page = (root/'teacher'/'ST_Guitar_S2A_V2_Tek_Oturum.html').read_text(encoding='utf-8')

          assert manifest['protocol_version'] == 'S2-A.v2-GUITARSET-FIXED-VOICING.v1'
          assert manifest['hc_rule_version'] == 'S1-H-C.v2'
          assert manifest['task_count'] == 290
          assert manifest['development_presentation_count'] == 230
          assert manifest['final_presentation_count'] == 60
          assert manifest['real_fit_authorized_before_gate'] is False
          assert manifest['final_labels_authorized_before_model_seal'] is False
          assert manifest['checkpoint_authorized'] is False
          assert manifest['runtime_connection_authorized'] is False
          assert all(2 <= int(task['assignment_count']) <= 8 for task in manifest['tasks'])
          assert all(task['assignment_count'] == len(task['options']) for task in manifest['tasks'])
          assert all('manual_entry_format' not in task for task in manifest['tasks'])
          assert len({task['task_id'] for task in manifest['tasks']}) == 290

          assert audit['source_archive_sha256'] == '06dc776d1de92021632e30795f0d4f38534fe01ca5342a164e80e8cd287980fe'
          assert audit['development_original_count'] == 200
          assert audit['reliability_repeat_count'] == 30
          assert audit['untouched_final_count'] == 60
          assert audit['teacher_presentation_count'] == 290
          assert len(audit['track_split']['development_tracks']) == 24
          assert len(audit['track_split']['final_tracks']) == 6
          assert not (set(audit['track_split']['development_tracks']) & set(audit['track_split']['final_tracks']))
          assert len(audit['repeat_pairs']) == 30
          assert audit['selection_used_teacher_labels'] is False
          assert audit['selection_used_model_scores'] is False
          assert audit['selection_used_baseline_scores'] is False
          assert audit['historical_s2a_v1_labels_used'] is False
          assert audit['historical_teacher_correction_labels_used'] is False

          originals = [r for r in audit['rows'] if r['role'] == 'DEVELOPMENT_ORIGINAL']
          repeats = [r for r in audit['rows'] if r['role'] == 'RELIABILITY_REPEAT']
          finals = [r for r in audit['rows'] if r['role'] == 'UNTOUCHED_FINAL']
          assert (len(originals), len(repeats), len(finals)) == (200, 30, 60)
          assert not ({r['family_id'] for r in originals} & {r['family_id'] for r in finals})
          assert not ({r['semantic_fingerprint'] for r in originals} & {r['semantic_fingerprint'] for r in finals})

          teacher_blob = json.dumps(manifest, sort_keys=True) + page
          for forbidden in ('source_member', 'recording_id', 'performer', 'track_key', 'style_key', 'repeat_of'):
              assert forbidden not in teacher_blob
          assert 'localStorage' in page
          assert 'DEVELOPMENT JSON indir' in page
          assert 'FINAL SEALED JSON indir' in page
          assert 'ELLE DÜZELT' not in page
          print(json.dumps({
              'teacher_presentations': manifest['task_count'],
              'development_originals': audit['development_original_count'],
              'hidden_repeats': audit['reliability_repeat_count'],
              'untouched_final': audit['untouched_final_count'],
              'development_families': len(audit['track_split']['development_tracks']),
              'final_families': len(audit['track_split']['final_tracks']),
              'eligible_pool': audit['eligible_fixed_voicing_task_count'],
              'manifest_sha256': manifest['manifest_sha256'],
          }, indent=2, sort_keys=True))
          PY
      - name: Upload Teacher package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st-guitar-s2a-v2-single-session-teacher
          path: /tmp/st-guitar-s2a-v2/teacher
          if-no-files-found: error
          retention-days: 30
      - name: Upload internal audit package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st-guitar-s2a-v2-single-session-internal
          path: /tmp/st-guitar-s2a-v2/internal
          if-no-files-found: error
          retention-days: 30
