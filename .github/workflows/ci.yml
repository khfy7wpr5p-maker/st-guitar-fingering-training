name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Stage 7B-C2 full behavior comparison
        if: startsWith(github.head_ref, 'agent/stage7b-c2-')
        run: python scripts/evaluate_synthetic_behavior_cv.py --families 100 --events-per-family 24 --folds 5
      - name: Compile validation
        run: python -m compileall -q src scripts tests
      - name: Build exact E3-E Teacher package artifact
        if: github.head_ref == 'agent/stage7g-e3-e-b-package-artifact'
        run: python scripts/build_stage7g_e3_e_teacher_package_artifact.py
      - name: Upload exact E3-E Teacher package artifact
        if: github.head_ref == 'agent/stage7g-e3-e-b-package-artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ST_Guitar_E3E_Teacher_GOLD_240
          path: artifacts/ST_Guitar_E3E_Teacher_GOLD_240.zip
          if-no-files-found: error
          retention-days: 1
