name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_NO_INPUT: "1"
  PIP_CONSTRAINT: ci/constraints.txt

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install pinned CI environment
        run: |
          python -m pip install "pip==24.3.1"
          python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Required H-C capacity safety gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/st-guitar-required-hc
          mkdir -p /tmp/st-guitar-required-hc
          python scripts/run_s2a_hc_capacity_audit.py \
            --old-teacher-manifest evidence/stage7g_c_r1_animetab_batch01_manifest.json \
            --origin-alias-manifest evidence/stage7g_e3_s2a_historical_origin_aliases_v1.json \
            --quarantine-manifest evidence/stage7e_final_test_seal.json \
            --quarantine-manifest evidence/stage7g_e3_e_a1_source_manifest.json \
            --prior-final-semantic-quarantine evidence/stage7g_e3_s2a_prior_final_semantic_quarantine_v1.json \
            --output /tmp/st-guitar-required-hc/hc_capacity_audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/st-guitar-required-hc/hc_capacity_audit.json').read_text(encoding='utf-8'))
          assert data['schema'] == 'st-guitar-stage7g-e3-s2a-hc-capacity-audit-v1'
          assert data['status'] == 'PASS'
          assert data['initial_reservation']['total_source_count'] == 120
          assert data['initial_reservation']['invariants']['pass'] is True
          assert data['replacement_execution']['unfilled_failure_count'] == 0
          assert data['final_reservation']['total_source_count'] == 120
          assert data['final_reservation']['hc_pass_source_count'] == 120
          assert data['final_reservation']['hc_fail_source_count'] == 0
          assert data['final_reservation']['invariants']['pass'] is True
          assert data['scientific_boundary']['h_c_capacity_audit_executed'] is True
          assert data['scientific_boundary']['all_initial_120_sources_audited'] is True
          assert data['scientific_boundary']['new_teacher_labels_collected'] is False
          assert data['scientific_boundary']['real_model_fit_executed'] is False
          assert data['scientific_boundary']['untouched_final_labels_opened'] is False
          assert data['scientific_boundary']['checkpoint_retained'] is False
          assert data['scientific_boundary']['shadow_or_production_integration'] is False
          PY
      - name: Required Teacher Correction safety gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/st-guitar-required-tcv1
          python scripts/build_teacher_correction_v1_pilot.py \
            --freeze-manifest evidence/stage7g_e3_s2a_hc_qualified_reservation_freeze_v1.json \
            --teacher-quarantine-manifest evidence/teacher_correction_v1_permanent_quarantine.json \
            --old-teacher-manifest evidence/stage7g_c_r1_animetab_batch01_manifest.json \
            --origin-alias-manifest evidence/stage7g_e3_s2a_historical_origin_aliases_v1.json \
            --quarantine-manifest evidence/stage7e_final_test_seal.json \
            --quarantine-manifest evidence/stage7g_e3_e_a1_source_manifest.json \
            --prior-final-semantic-quarantine evidence/stage7g_e3_s2a_prior_final_semantic_quarantine_v1.json \
            --output-dir /tmp/st-guitar-required-tcv1
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/st-guitar-required-tcv1')
          m = json.loads((root/'teacher'/'ST_Guitar_TeacherCorrectionV1_Pilot01_manifest.json').read_text(encoding='utf-8'))
          a = json.loads((root/'internal'/'ST_Guitar_TeacherCorrectionV1_Pilot01_audit.json').read_text(encoding='utf-8'))
          assert m['schema'] == 'st-guitar-teacher-correction-v1-manifest'
          assert m['protocol_version'] == 'TEACHER_CORRECTION.v1'
          assert m['status'] == 'READY_FOR_TEACHER_CORRECTION'
          assert m['task_count'] == 20
          assert a['family_count'] == 20
          assert a['primary_family_pool_count'] == 51
          assert a['manageable_family_pool_count'] >= 20
          assert a['max_solutions_per_task'] == 24
          assert a['contingency_sources_used'] == 0
          assert a['untouched_final_sources_used'] == 0
          assert a['historical_teacher_responses_used'] is False
          assert a['model_scores_used'] is False
          assert a['training_authorized'] is False
          assert a['checkpoint_retention_authorized'] is False
          assert a['untouched_final_opened'] is False
          assert a['shadow_or_production_authorized'] is False
          assert len({t['task_id'] for t in m['tasks']}) == 20
          assert len({t['task_fingerprint'] for t in m['tasks']}) == 20
          assert all(2 <= t['solution_count'] <= 24 for t in m['tasks'])
          PY
      - name: Stage 7B-C2 full behavior comparison
        if: startsWith(github.head_ref, 'agent/stage7b-c2-')
        run: python scripts/evaluate_synthetic_behavior_cv.py --families 100 --events-per-family 24 --folds 5
      - name: Compile validation
        run: python -m compileall -q src scripts tests
