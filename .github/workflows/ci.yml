name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Stage 7B-C2 full behavior comparison
        if: startsWith(github.head_ref, 'agent/stage7b-c2-')
        run: python scripts/evaluate_synthetic_behavior_cv.py --families 100 --events-per-family 24 --folds 5
      - name: Compile validation
        run: python -m compileall -q src scripts tests
      - name: Rebuild label-free E3 feature audits
        if: startsWith(github.head_ref, 'agent/stage7g-e3-e-c-untouched-execution')
        run: python scripts/rebuild_stage7g_e3_feature_audits.py
      - name: Upload label-free E3 feature audits
        if: startsWith(github.head_ref, 'agent/stage7g-e3-e-c-untouched-execution')
        uses: actions/upload-artifact@v4
        with:
          name: stage7g-e3-e-feature-audits
          path: artifacts/e3_feature_audits/*.json
          if-no-files-found: error
          retention-days: 1
