name: teacher-correction-manual-regression

on:
  pull_request:
    paths:
      - '.github/workflows/teacher_correction_manual_regression.yml'
      - 'scripts/build_teacher_correction_v1_manual_regression.py'
      - 'src/st_guitar_fingering_training/finger_assignments_v2.py'
      - 'src/st_guitar_fingering_training/teacher_correction_manual_v1.py'
      - 'tests/test_teacher_correction_manual_regression.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Focused S1-H-C v2 and manual validator tests
        run: python -m unittest tests.test_teacher_correction_manual_regression -v
      - name: Build short regression test
        run: |
          rm -rf /tmp/tcv1-manual-regression
          python scripts/build_teacher_correction_v1_manual_regression.py --output-dir /tmp/tcv1-manual-regression
      - name: Validate regression artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/tcv1-manual-regression')
          manifest = json.loads((root/'ST_Guitar_TeacherCorrectionV1_ManualRegression_manifest.json').read_text(encoding='utf-8'))
          evidence = json.loads((root/'ST_Guitar_TeacherCorrectionV1_ManualRegression_evidence.json').read_text(encoding='utf-8'))
          html = (root/'ST_Guitar_TeacherCorrectionV1_ManualRegression.html').read_text(encoding='utf-8')
          assert manifest['protocol_version'] == 'TEACHER_CORRECTION.v1'
          assert manifest['hc_rule_version'] == 'S1-H-C.v2'
          assert manifest['task_count'] == 6
          assert manifest['training_authorized'] is False
          assert evidence['status'] == 'PASS'
          assert evidence['e_minor_validator_status'] == 'VALID_EXACT_S1HC_V2'
          assert evidence['e_minor_barres'] == []
          assert 'ELLE DÜZELT' in html
          assert 'DOĞRULA + KAYDET' in html
          assert 'ELE / REDDET' in html
          PY
      - name: Upload regression Teacher file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st-guitar-teacher-correction-v1-manual-regression
          path: /tmp/tcv1-manual-regression
          if-no-files-found: error
          retention-days: 14
