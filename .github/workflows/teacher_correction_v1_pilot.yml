name: teacher-correction-v1-pilot

on:
  pull_request:
    paths:
      - '.github/workflows/teacher_correction_v1_pilot.yml'
      - 'scripts/build_teacher_correction_v1_pilot.py'
      - 'src/st_guitar_fingering_training/teacher_correction.py'
      - 'src/st_guitar_fingering_training/finger_assignments.py'
      - 'evidence/teacher_correction_v1_permanent_quarantine.json'
      - 'evidence/stage7g_e3_s2a_hc_qualified_reservation_freeze_v1.json'
      - 'evidence/stage7g_e3_s2a_historical_origin_aliases_v1.json'
      - 'evidence/stage7g_e3_s2a_prior_final_semantic_quarantine_v1.json'
      - 'evidence/stage7g_c_r1_animetab_batch01_manifest.json'
      - 'evidence/stage7e_final_test_seal.json'
      - 'evidence/stage7g_e3_e_a1_source_manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pilot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Build Teacher Correction v1 pilot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/st-guitar-tcv1-pilot
          python scripts/build_teacher_correction_v1_pilot.py \
            --freeze-manifest evidence/stage7g_e3_s2a_hc_qualified_reservation_freeze_v1.json \
            --teacher-quarantine-manifest evidence/teacher_correction_v1_permanent_quarantine.json \
            --old-teacher-manifest evidence/stage7g_c_r1_animetab_batch01_manifest.json \
            --origin-alias-manifest evidence/stage7g_e3_s2a_historical_origin_aliases_v1.json \
            --quarantine-manifest evidence/stage7e_final_test_seal.json \
            --quarantine-manifest evidence/stage7g_e3_e_a1_source_manifest.json \
            --prior-final-semantic-quarantine evidence/stage7g_e3_s2a_prior_final_semantic_quarantine_v1.json \
            --output-dir /tmp/st-guitar-tcv1-pilot
      - name: Validate pilot boundary and UI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/st-guitar-tcv1-pilot')
          manifest_path = root/'teacher'/'ST_Guitar_TeacherCorrectionV1_Pilot01_manifest.json'
          html_path = root/'teacher'/'ST_Guitar_TeacherCorrectionV1_Pilot01.html'
          audit_path = root/'internal'/'ST_Guitar_TeacherCorrectionV1_Pilot01_audit.json'
          m = json.loads(manifest_path.read_text(encoding='utf-8'))
          a = json.loads(audit_path.read_text(encoding='utf-8'))
          assert m['schema'] == 'st-guitar-teacher-correction-v1-manifest'
          assert m['protocol_version'] == 'TEACHER_CORRECTION.v1'
          assert m['status'] == 'READY_FOR_TEACHER_CORRECTION'
          assert m['task_count'] == 40
          assert a['family_count'] == 40
          assert a['contingency_sources_used'] == 0
          assert a['untouched_final_sources_used'] == 0
          assert a['historical_teacher_responses_used'] is False
          assert a['model_scores_used'] is False
          assert a['training_authorized'] is False
          task_ids = [t['task_id'] for t in m['tasks']]
          fps = [t['task_fingerprint'] for t in m['tasks']]
          assert len(task_ids) == len(set(task_ids)) == 40
          assert len(fps) == len(set(fps)) == 40
          assert all(t['solution_count'] >= 2 for t in m['tasks'])
          assert all(t['initial_assignment_id'] in {s['assignment_id'] for s in t['solutions']} for t in m['tasks'])
          forbidden = {'family_id','source_sha256','raw_sha256','origin_group_key','source_path'}
          def walk(v):
              if isinstance(v, dict):
                  assert forbidden.isdisjoint(v.keys())
                  for child in v.values(): walk(child)
              elif isinstance(v, list):
                  for child in v: walk(child)
          walk(m)
          h = html_path.read_text(encoding='utf-8')
          assert 'ELE / REDDET' in h
          assert 'Sonraki cevapsız' in h
          assert 'st_guitar_tcv1_permanent_quarantine' in h
          assert "if(!decisions[tasks[i].task_id])" in h
          PY
      - name: Upload Teacher Correction pilot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st-guitar-teacher-correction-v1-pilot
          path: /tmp/st-guitar-tcv1-pilot/teacher
          if-no-files-found: error
          retention-days: 14
      - name: Upload internal audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: st-guitar-teacher-correction-v1-pilot-internal
          path: /tmp/st-guitar-tcv1-pilot/internal
          if-no-files-found: error
          retention-days: 14
