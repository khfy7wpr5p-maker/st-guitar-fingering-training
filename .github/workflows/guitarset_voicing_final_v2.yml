name: guitarset-voicing-final-v2

on:
  pull_request:

permissions:
  contents: read

jobs:
  untouched-final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Decide whether v2 UNTOUCHED_FINAL may open
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          request='evidence/stage7g_e4_guitarset_observed_voicing_final_open_request_v2.json'
          result='evidence/stage7g_e4_guitarset_observed_voicing_final_v2.json'
          test -f "$request"
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('evidence/stage7g_e4_guitarset_observed_voicing_final_open_request_v2.json').read_text())
          assert p['schema'] == 'st-guitar-guitarset-observed-voicing-final-open-request-v2'
          assert p['final_access_authorized'] is True
          assert p['final_performer'] == '02'
          assert p['development_evidence_sha256'] == '177cc54ef38c619f475074f9e1c529865772d182a135faf4f4cdf50ee2c64351'
          assert p['development_model_artifact_sha256'] == '7a56436c27ee6d996a49e7f989d37d7ffff187232277095b176c3c395c432314'
          assert p['validation_evidence_sha256'] == '2df8a41bf9c319c481984d116b473ebb78a4569faf36b2a5ec3a883f6b96d987'
          assert p['protocol_sha256'] == 'db67d88c4889a2b8c63411cd1e9bbd7481248dfbdd76da67f5df60b3871b4c02'
          assert p['model_refit_authorized'] is False
          assert p['runtime_connection_authorized'] is False
          assert p['production_authorized'] is False
          assert p['shadow_integration_authorized'] is False
          PY
          if test -f "$result"; then
            echo 'run_final=false' >> "$GITHUB_OUTPUT"
            echo 'GuitarSet v2 final evidence already sealed; performer 02 will not be reopened.'
          else
            echo 'run_final=true' >> "$GITHUB_OUTPUT"
            echo 'Opening authorized one-shot GuitarSet v2 UNTOUCHED_FINAL performer 02 only.'
          fi

      - name: Install frozen final environment
        if: steps.gate.outputs.run_final == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.3.5' 'scikit-learn==1.8.0'
          python -m pip install -e .

      - name: Focused final safety tests
        if: steps.gate.outputs.run_final == 'true'
        run: |
          python -m unittest tests.test_guitarset_voicing_final_v2 -v
          python -m compileall -q src scripts tests

      - name: Download hash-pinned GuitarSet 1.0.1 annotations
        if: steps.gate.outputs.run_final == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            'https://zenodo.org/records/1422265/files/GuitarSet_annotation_only.zip?download=1' \
            --output /tmp/GuitarSet_annotation_only.zip
          echo '06dc776d1de92021632e30795f0d4f38534fe01ca5342a164e80e8cd287980fe  /tmp/GuitarSet_annotation_only.zip' | sha256sum -c -

      - name: Execute one-shot GuitarSet v2 UNTOUCHED_FINAL
        if: steps.gate.outputs.run_final == 'true'
        id: final
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/guitarset-final-v2
          set +e
          python scripts/run_guitarset_voicing_final_v2.py \
            /tmp/GuitarSet_annotation_only.zip \
            --model evidence/stage7g_e4_guitarset_observed_voicing_development_model_v2.json \
            --validation-evidence evidence/stage7g_e4_guitarset_observed_voicing_validation_v2.json \
            --report /tmp/guitarset-final-v2/stage7g_e4_guitarset_observed_voicing_final_v2.json
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          test -f /tmp/guitarset-final-v2/stage7g_e4_guitarset_observed_voicing_final_v2.json

      - name: Upload sealed v2 UNTOUCHED_FINAL evidence
        if: steps.gate.outputs.run_final == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: guitarset-observed-voicing-final-v2
          path: /tmp/guitarset-final-v2/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce UNTOUCHED_FINAL gate result
        if: steps.gate.outputs.run_final == 'true'
        shell: bash
        run: test "${{ steps.final.outputs.exit_code }}" -eq 0
