[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "st-guitar-fingering-training"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = ["defusedxml>=0.7,<1", "numpy>=1.26", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]
