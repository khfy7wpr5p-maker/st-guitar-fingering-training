];
let ti=0, phase="A", ANS={};
const KEY="s0db_"+MSH.slice(0,14);
try{ANS=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){ANS={}}
const NN=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
function nn(m){return NN[((m%12)+12)%12]+(Math.floor(m/12)-1)}
function key(t,side,dim){return t.task_id+"|"+side+"|"+dim}
function okSide(t,side){return DIMS.every(d=>ANS[key(t,side,d[0])]>=1&&ANS[key(t,side,d[0])]<=5)}
function overallKey(t){return t.task_id+"|OVERALL"}
function taskComplete(t){return okSide(t,"A")&&okSide(t,"B")&&!!ANS[overallKey(t)]}
function completeCount(){return TASKS.filter(taskComplete).length}
function save(){try{localStorage.setItem(KEY,JSON.stringify(ANS))}catch(e){}}
function ph(p){return p.map(x=>`<div class="place"><b>${nn(x.pitch_midi)}</b> · Tel ${x.string} · Perde ${x.fret}</div>`).join("")}
function fh(p){const h=new Map(p.map(x=>[x.string+":"+x.fret,nn(x.pitch_midi)]));let s="";for(let st=1;st<=6;st++){s+=`<div class="r"><div>${st}</div>`;for(let f=0;f<=12;f++){let x=h.get(st+":"+f);s+=`<div class="f ${x?"hit":""}">${x||f}</div>`}s+="</div>"}return s}
function optionHTML(t,side){const o=t.options.find(x=>x.option_id===side);return `<div class="option"><div class="letter">${side}</div>${ph(o.placements)}<div class="fb">${fh(o.placements)}</div></div>`}
function ratingHTML(t,side){let s=optionHTML(t,side);for(const d of DIMS){const v=ANS[key(t,side,d[0])]||0;s+=`<div class="q"><div class="qt">${d[1]}</div><div class="rule">${d[2]}<br>${d[3]}</div><div class="scale">${[1,2,3,4,5].map(n=>`<button class="${v===n?"on":""}" onclick="rate('${side}','${d[0]}',${n})">${n}</button>`).join("")}</div></div>`}s+=`<button class="next" ${okSide(t,side)?"":"disabled"} onclick="advancePhase()">${side==="A"?"B seçeneğini puanla":"Genel tercihe geç"}</button>`;return s}
function overallHTML(t){let a=t.options.find(x=>x.option_id==="A"),b=t.options.find(x=>x.option_id==="B"),v=ANS[overallKey(t)]||"";return `<div class="note">İki seçeneği artık birlikte görüyorsun. Alt puanları değiştirmeden yalnız genel gitaristik tercihini ver.</div><div class="summary"><div class="mini"><div class="letter">A</div>${ph(a.placements)}<div class="fb">${fh(a.placements)}</div></div><div class="mini"><div class="letter">B</div>${ph(b.placements)}<div class="fb">${fh(b.placements)}</div></div></div><div class="overall"><button class="${v==="A"?"on":""}" onclick="setOverall('A')">A daha iyi</button><button class="${v==="B"?"on":""}" onclick="setOverall('B')">B daha iyi</button><button class="${v==="EQUAL_OR_UNSURE"?"on":""}" onclick="setOverall('EQUAL_OR_UNSURE')">Eşit / Emin değilim</button></div>`}
function render(){const t=TASKS[ti],done=completeCount();document.getElementById("taskTitle").textContent="Görev "+(ti+1);document.getElementById("pitches").textContent="Sesler: "+t.pitches_midi.map(nn).join(" · ");document.getElementById("status").textContent=`Görev ${ti+1}/20 · ${done} tamam`;document.getElementById("bar").style.width=(done/20*100)+"%";document.getElementById("phaseTop").textContent=phase==="A"?"A puanlama":phase==="B"?"B puanlama":"Genel tercih";document.getElementById("phase").textContent=phase==="A"?"Önce A seçeneğini tek başına 1–5 puanla.":phase==="B"?"Şimdi B seçeneğini tek başına 1–5 puanla.":"Son olarak iki seçeneği birlikte değerlendir.";document.getElementById("content").innerHTML=phase==="A"?ratingHTML(t,"A"):phase==="B"?ratingHTML(t,"B"):overallHTML(t);document.getElementById("finish").classList.toggle("show",done===20)}
function rate(side,dim,n){ANS[key(TASKS[ti],side,dim)]=n;save();render()}
function advancePhase(){const t=TASKS[ti];if(phase==="A"&&okSide(t,"A"))phase="B";else if(phase==="B"&&okSide(t,"B"))phase="OVERALL";render();window.scrollTo({top:0,behavior:"smooth"})}
function setOverall(v){ANS[overallKey(TASKS[ti])]=v;save();render();if(ti<19)setTimeout(()=>{ti++;phase="A";render();window.scrollTo({top:0,behavior:"smooth"})},130)}
function next(){if(phase==="A")phase="B";else if(phase==="B")phase="OVERALL";else if(ti<19){ti++;phase="A"}render();window.scrollTo({top:0,behavior:"smooth"})}
function prev(){if(phase==="OVERALL")phase="B";else if(phase==="B")phase="A";else if(ti>0){ti--;phase="OVERALL"}render();window.scrollTo({top:0,behavior:"smooth"})}
function findIncomplete(){for(let i=0;i<20;i++){const t=TASKS[i];if(!okSide(t,"A")){ti=i;phase="A";render();return}if(!okSide(t,"B")){ti=i;phase="B";render();return}if(!ANS[overallKey(t)]){ti=i;phase="OVERALL";render();return}}alert("Tüm görevler tamamlandı.")}

render();
